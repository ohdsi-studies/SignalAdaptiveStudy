# Tests on pull requests to main and on demand (Actions tab, "Run workflow"), with the dev renv profile.
name: tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      RENV_PROFILE: dev
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}   # renv installs Cyclops from GitHub at the pinned commit
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: false   # .Rprofile sets Posit Package Manager binaries
      - uses: r-lib/actions/setup-renv@v2
      - name: Install the package
        run: Rscript -e 'install.packages(".", repos = NULL, type = "source")'
      - name: Tests
        run: Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'
      - name: Smoke test
        run: Rscript extras/production/smokeTest.R
